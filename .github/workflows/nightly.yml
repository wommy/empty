name: nightly

# The slow tier of ADR 0005. Nothing here gates a PR. A failure files an issue
# carrying the reproducer; the reproducer is then committed as a seed-corpus
# entry (testdata/fuzz/<Target>/<hash>) so the PR tier replays it forever.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, off the hour
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Per-target fuzz duration (Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzCreateConverges, pkg: ./internal/endpoint }
          - { name: FuzzReconcileSafe, pkg: ./internal/endpoint }
          - { name: FuzzDecodeGetJSON, pkg: ./internal/zfs }
          - { name: FuzzClassify, pkg: ./internal/zfs }
          # the NFS export chain against the libshare/exportfs/mountd
          # models in internal/nfsref (wave9 nfs-diff)
          - { name: FuzzNFSRoundTrip, pkg: ./internal/endpoint }
          - { name: FuzzNFSClassifier, pkg: ./internal/endpoint }
          - { name: FuzzNFSVerifier, pkg: ./internal/endpoint }
          - { name: FuzzNFSEtabParse, pkg: ./internal/endpoint }
          # the reference model of zfs(8) against the simulator
          # (internal/zfs/zfsdiff, wave9 zfs-diff)
          - { name: FuzzDiff, pkg: ./internal/zfs/zfsdiff }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: nightly-fuzz
      - name: fuzz ${{ matrix.target.name }}
        id: fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime "${{ inputs.fuzztime || '5m' }}" -fuzzminimizetime 30s ${{ matrix.target.pkg }}
      - name: collect reproducer
        if: failure() && steps.fuzz.conclusion == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/repro"
          # go test writes a failing input to <pkg>/testdata/fuzz/<Target>/<hash>
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | tee "$RUNNER_TEMP/repro/files.txt"
          xargs -a "$RUNNER_TEMP/repro/files.txt" -r -I{} cp --parents {} "$RUNNER_TEMP/repro/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.fuzz.conclusion == 'failure'
        with:
          name: fuzz-repro-${{ matrix.target.name }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore
          retention-days: 30
      - name: file issue
        if: failure() && steps.fuzz.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly fuzz of \`$TARGET\` failed: $RUN_URL"
            echo
            echo "Add each reproducer below to the seed corpus at the path shown, with a test or fix, so the PR tier replays it."
            while read -r f; do
              echo; echo "### \`$f\`"; echo '```'; cat "$f"; echo '```'
            done < "$RUNNER_TEMP/repro/files.txt"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly fuzz failure: $TARGET" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage

  # The real-pool tiers ADR 0005 keeps out of the PR budget, on the same VM
  # suite as ci.yml:
  # - ZFSDIFF_FULL=1: the whole zfsdiff corpus (102 sequences, ~1,270 zfs
  #   invocations; the PR replays zfsdiff.PRSample, 21 sequences, 9.9s on
  #   run 40469622947). Divergences are reported, not failed, until the
  #   three ambiguities are settled (ZFSDIFF_STRICT);
  # - ZFS_CRASH_FULL=1: every crash point of every case on the real pool
  #   (internal/endpoint/crash_test.go crashSample; the PR runs each case
  #   uninterrupted plus one rotated point). The simulator runs every point
  #   on every PR.
  # A harness, cleanup or suite failure (a crash case that does not
  # converge, say) files an issue; its fix lands with a test that fails
  # without it.
  real-zfs-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: nightly-real-zfs
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
      - name: resolve the cloud image and cache keys
        # the same keys as ci.yml's real-zfs job (one action computes both),
        # restored only: cache-warm.yml stores them
        id: keys
        uses: ./.github/actions/real-zfs-keys
      - name: restore the provisioned guest
        id: guest
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zfsvm-cache
          key: ${{ steps.keys.outputs.guest }}
      - name: restore qemu
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qemu
          key: ${{ steps.keys.outputs.qemu }}
      - name: set up qemu
        run: |
          if ci/qemu-tree.sh "$RUNNER_TEMP/qemu"; then
            echo "$RUNNER_TEMP/qemu/bin" >>"$GITHUB_PATH"
          else
            rm -rf "$RUNNER_TEMP/qemu"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
          fi
          test -s /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
      - name: install cloud-image-utils (cold guest only)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cloud-image-utils
      - name: VM suite with the full zfsdiff replay and the full crash sweep
        id: replay
        env:
          ZFSVM_CACHE: ${{ runner.temp }}/zfsvm-cache
          ZFSVM_SUMS: ${{ steps.keys.outputs.sums }}
          ZFSDIFF_FULL: "1"
          ZFS_CRASH_FULL: "1"
        run: ci/real-zfs-vm.sh stonking current 2.4
      - name: upload zfsdiff replay report and shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zfsdiff-report-full
          path: |
            ${{ runner.temp }}/zfsvm/out/*.log
            ${{ runner.temp }}/zfsvm/out/test-times.tsv
            ${{ runner.temp }}/zfsvm/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: file issue
        if: failure() && steps.replay.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          o=$RUNNER_TEMP/zfsvm/out
          {
            echo "Nightly real-ZFS VM suite (full zfsdiff replay, full crash sweep) failed: $RUN_URL"
            echo
            echo "The zfsdiff-report-full artifact has the replay report and the shard logs."
            echo "A crash case that did not converge names its case and crash point below; commit the fix with a test that fails without it."
            echo; echo '```'
            grep -hE -- '--- FAIL|panic:' "$o"/endpoint.*.log 2>/dev/null | head -n 40 || true
            tail -n 1 "$o/zfsdiff.log" 2>/dev/null || echo "no zfsdiff.log"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly real-ZFS failure" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage

  # The scale tests and the recovery FSM explorer
  # (internal/endpoint/fsm_explore_test.go: TestExploreLifecycle). Contract
  # with the test code: they carry `//go:build nightly`, are named TestScale*
  # and TestExplore*, and take their budget from -timeout. A run in which no
  # such test passed (a lost build tag, a renamed test) fails: green with
  # "[no tests to run]" is not coverage (ci/check-explore-ran.sh).
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: nightly-explore
      - name: scale tests and FSM explorer
        id: explore
        run: go test -tags nightly -count=1 -timeout 25m -run '^Test(Scale|Explore)' -v ./... | tee "$RUNNER_TEMP/explore.log"
      - name: explorer tests ran
        id: ran
        run: ci/check-explore-ran.sh "$RUNNER_TEMP/explore.log"
      - name: file issue
        if: failure() && (steps.explore.conclusion == 'failure' || steps.ran.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly scale/explorer run failed: $RUN_URL"
            echo; echo '```'; grep -E '^(--- FAIL|FAIL|panic)' -A5 "$RUNNER_TEMP/explore.log" | head -80; echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly explorer failure" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage
