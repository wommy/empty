name: nightly

# The slow tier of ADR 0005. Nothing here gates a PR. A failure files an issue
# carrying the reproducer; the reproducer is then committed as a seed-corpus
# entry (testdata/fuzz/<Target>/<hash>) so the PR tier replays it forever.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, off the hour
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Per-target fuzz duration (Go duration)
        default: 5m

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzCreateConverges, pkg: ./internal/endpoint }
          - { name: FuzzReconcileSafe, pkg: ./internal/endpoint }
          - { name: FuzzDecodeGetJSON, pkg: ./internal/zfs }
          - { name: FuzzClassify, pkg: ./internal/zfs }
          # the NFS export chain against the libshare/exportfs/mountd
          # models in internal/nfsref (wave9 nfs-diff)
          - { name: FuzzNFSRoundTrip, pkg: ./internal/endpoint }
          - { name: FuzzNFSClassifier, pkg: ./internal/endpoint }
          - { name: FuzzNFSVerifier, pkg: ./internal/endpoint }
          - { name: FuzzNFSEtabParse, pkg: ./internal/endpoint }
          # the reference model of zfs(8) against the simulator
          # (internal/zfs/zfsdiff, wave9 zfs-diff)
          - { name: FuzzDiff, pkg: ./internal/zfs/zfsdiff }
          # the model checker's generator from fuzz bytes (simulator only),
          # and the destroy-all simulation past the 1000 seeds the unit
          # test runs
          - { name: FuzzModel, pkg: ./internal/endpoint }
          - { name: FuzzSimulateDestroyAllEquivalent, pkg: ./internal/endpoint }
        # every func Fuzz* of the repository exactly once, in its package
        # (ci/check-suites.sh)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: nightly-fuzz
      - name: fuzz ${{ matrix.target.name }}
        id: fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime "${{ inputs.fuzztime || '5m' }}" -fuzzminimizetime 30s ${{ matrix.target.pkg }}
      - name: collect reproducer
        if: failure() && steps.fuzz.conclusion == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/repro"
          # go test writes a failing input to <pkg>/testdata/fuzz/<Target>/<hash>
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | tee "$RUNNER_TEMP/repro/files.txt"
          xargs -a "$RUNNER_TEMP/repro/files.txt" -r -I{} cp --parents {} "$RUNNER_TEMP/repro/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.fuzz.conclusion == 'failure'
        with:
          name: fuzz-repro-${{ matrix.target.name }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore
          retention-days: 30
      - name: file issue
        if: failure() && steps.fuzz.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly fuzz of \`$TARGET\` failed: $RUN_URL"
            echo
            echo "Add each reproducer below to the seed corpus at the path shown, with a test or fix, so the PR tier replays it."
            while read -r f; do
              echo; echo "### \`$f\`"; echo '```'; cat "$f"; echo '```'
            done < "$RUNNER_TEMP/repro/files.txt"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly fuzz failure: $TARGET" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage

  # The real-pool tiers ADR 0005 keeps out of the PR budget, on the same VM
  # suite as ci.yml:
  # - ZFSDIFF_FULL=1: the whole zfsdiff corpus (102 sequences, ~1,270 zfs
  #   invocations; the PR replays zfsdiff.PRSample, 21 sequences, 9.9s on
  #   run 40469622947). Divergences are reported, not failed, until the
  #   three ambiguities are settled (ZFSDIFF_STRICT);
  # - ZFS_CRASH_FULL=1: every crash point of every case on the real pool
  #   (internal/endpoint/crash_test.go crashSample; the PR runs each case
  #   uninterrupted plus one rotated point), and every destroy of
  #   TestDestroyNeverHitsAReplacedDataset (swapSweep; the PR swaps the
  #   first of each case). The simulator runs every point on every PR.
  # A harness, cleanup or suite failure (a crash case that does not
  # converge, say) files an issue; its fix lands with a test that fails
  # without it. One job per suite (ci/real-zfs-suites.txt), each unsplit:
  # ci.yml splits the endpoint suite over two jobs (ZFSVM_PART), nightly
  # runs it as one part of three shards. The two sweeps are endpoint
  # tests; the csi job runs the csi suite against the same guest.
  # The csi job boots with ZFSVM_INITRD=1: through the BIOS, GRUB and the
  # disk's own initrd, unmasked, the fallback ci/real-zfs-vm.sh takes only
  # when the direct kernel boot fails, so a GRUB timeout or a slower boot
  # shows here first, not on the day the fast path breaks. The endpoint
  # job keeps the direct boot, as ci.yml.
  real-zfs-full:
    name: real-zfs-full (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # every suite of ci/real-zfs-suites.txt exactly once
        # (ci/check-suites.sh)
        suite: [endpoint, csi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          # restore only (no save here): ci.yml's namespace, which
          # cache-warm.yml keeps warm on the default branch
          cache-name: real-zfs-${{ matrix.suite }}
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
      - name: resolve the cloud image and cache keys
        # the same keys as ci.yml's real-zfs job (one action computes both),
        # restored only: cache-warm.yml stores them
        id: keys
        uses: ./.github/actions/real-zfs-keys
      - name: restore the provisioned guest and qemu
        # one entry, the same paths and keys as ci.yml
        id: vm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/zfsvm-cache
            ${{ runner.temp }}/qemu
          key: ${{ steps.keys.outputs.vm }}
          restore-keys: ${{ steps.keys.outputs.vm-fallback }}
      - name: set up qemu
        run: |
          if ci/qemu-tree.sh "$RUNNER_TEMP/qemu"; then
            echo "$RUNNER_TEMP/qemu/bin" >>"$GITHUB_PATH"
          else
            rm -rf "$RUNNER_TEMP/qemu"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
          fi
          test -s /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
      - name: install cloud-image-utils (cold guest only)
        if: steps.vm.outputs.cache-matched-key == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cloud-image-utils
      - name: VM suite ${{ matrix.suite }} with the full zfsdiff replay and the full crash sweep
        id: replay
        env:
          ZFSVM_CACHE: ${{ runner.temp }}/zfsvm-cache
          ZFSVM_SUMS: ${{ steps.keys.outputs.sums }}
          ZFSVM_SUITE: ${{ matrix.suite }}
          ZFSDIFF_FULL: "1"
          ZFS_CRASH_FULL: "1"
          ZFSVM_INITRD: ${{ matrix.suite == 'csi' && '1' || '' }}
          # csi-sanity in NFS mode on the real pool (a fourth csi shard,
          # through the guest's nfsd), its passed specs compared exactly
          # with internal/csi/testdata/sanity-passed-nfs.txt. Nightly only:
          # in the PR csi job it would add about 2-4s to a job that sets
          # the pace in about half the runs (ADR 0005); the PR tier runs it
          # on the simulator (ci.yml's test job)
          ZFSVM_CSI_NFS: ${{ matrix.suite == 'csi' && '1' || '' }}
        run: ci/real-zfs-vm.sh stonking current 2.4
      - name: upload zfsdiff replay report and shard logs
        # with the shard plan and the test lists (what ci/check-split.sh
        # and ci/check-skips.sh read), the guest's load, and the
        # cloud-config a boot failure needs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zfsdiff-report-full-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/zfsvm/out/*.log
            ${{ runner.temp }}/zfsvm/out/test-times.tsv
            ${{ runner.temp }}/zfsvm/out/*.list
            ${{ runner.temp }}/zfsvm/out/*.plan
            ${{ runner.temp }}/zfsvm/out/*.passed
            ${{ runner.temp }}/zfsvm/out/load.txt
            ${{ runner.temp }}/zfsvm/out/vmstat.txt
            ${{ runner.temp }}/zfsvm/*.log
            ${{ runner.temp }}/zfsvm/user-data
          if-no-files-found: warn
          retention-days: 30
      - name: file issue
        if: failure() && steps.replay.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: ${{ matrix.suite }}
        run: |
          o=$RUNNER_TEMP/zfsvm/out
          {
            echo "Nightly real-ZFS VM suite $SUITE (full zfsdiff replay, full crash sweep) failed: $RUN_URL"
            echo
            echo "The zfsdiff-report-full-$SUITE artifact has the replay report and the shard logs."
            echo "A crash case that did not converge names its case and crash point below; commit the fix with a test that fails without it."
            echo; echo '```'
            cat "$o"/*.log 2>/dev/null | grep -hE -- '--- FAIL|panic:' | awk 'NR <= 40' || true
            tail -n 1 "$o/zfsdiff.log" 2>/dev/null || echo "no zfsdiff.log"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly real-ZFS failure ($SUITE)" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage

  # The recovery FSM explorer (internal/endpoint/fsm_explore_test.go:
  # TestExploreLifecycle) and the model sweep (model_nightly_test.go).
  # Contract with the test code: they carry `//go:build nightly`, are named
  # TestExplore*, and take their budget from -timeout. A run in which any
  # TestExplore* function of the repository did not pass (a lost build tag,
  # a renamed test) fails: green with "[no tests to run]" is not coverage
  # (ci/check-explore-ran.sh).
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: nightly-explore
      - name: FSM explorer and model sweep
        id: explore
        run: go test -tags nightly -count=1 -timeout 25m -run '^TestExplore' -v ./... | tee "$RUNNER_TEMP/explore.log"
      - name: explorer tests ran
        id: ran
        run: ci/check-explore-ran.sh "$RUNNER_TEMP/explore.log"
      - name: file issue
        if: failure() && (steps.explore.conclusion == 'failure' || steps.ran.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly scale/explorer run failed: $RUN_URL"
            echo; echo '```'; grep -E '^(--- FAIL|FAIL|panic)' -A5 "$RUNNER_TEMP/explore.log" | awk 'NR <= 80'; echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly explorer failure" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage
