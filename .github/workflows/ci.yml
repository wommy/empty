name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# one run per PR: a new push cancels the old run; every push to main gets
# its own group, so none is cancelled or dropped from the queue
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # go.mod's `go` line is 1.27.0 and its toolchain line 1.27.3: install
  # 1.27.3 directly and never switch, or the restored cache and the
  # switched toolchain collide (tar "Failed to restore" in every job)
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash # -eo pipefail, so `| tee` does not hide a failure

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum # key: unit
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go.mod and go.sum tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test (simulator)
        run: go test -race -count=1 ./...

  fuzz:
    # each target in parallel, off the unit job's critical path
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzCreateConverges, pkg: ./internal/endpoint }
          - { name: FuzzReconcileSafe, pkg: ./internal/endpoint }
          - { name: FuzzParseColumns, pkg: ./internal/zfs }
          - { name: FuzzClassify, pkg: ./internal/zfs }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false # the unit job owns the build cache
      - name: fuzz ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 30s -fuzzminimizetime 10s ${{ matrix.target.pkg }}

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # buf is run at a pinned version rather than added as a go.mod tool:
      # its large dependency tree would take part in this module's version
      # selection (grpc, protobuf, x/...). `go run pkg@version` is verified
      # against sum.golang.org and leaves no stale binary on PATH. The
      # protoc plugins are go.mod tools (buf.gen.yaml runs `go tool ...`),
      # so they always match the protobuf/grpc versions in go.sum.
      BUF: go run github.com/bufbuild/buf/cmd/buf@v1.47.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false # buf's modules once took over the shared cache key
      - name: buf lint
        run: $BUF lint
      - name: generated code up to date
        run: |
          $BUF generate
          test -z "$(gofmt -l gen | tee /dev/stderr)"
          git diff --exit-code -- gen/
          test -z "$(git status --porcelain -- gen | tee /dev/stderr)"

  real-zfs:
    # The real-ZFS gate: the endpoint contract tests and csi-sanity
    # (mount and block) against Ubuntu 26.10 (OpenZFS 2.4.x, the only
    # supported version, what TrueNAS 27 ships), with nfs-server running so
    # the file-export tests hit a real nfsd. Booted under KVM: no hosted
    # runner exists for it, and ZFS lives in the kernel, so a container
    # would test the host's ZFS instead.
    #
    # The guest is a prebaked bundle (ci/vm/bake.sh), cached under a hash of
    # its inputs and rebaked nightly (vm-image.yml). It boots while the Go
    # toolchain is fetched and the test binaries are built, and runs them in
    # parallel shards on separate tmpfs-backed pools. Every boot still
    # asserts that `zfs version` reports 2.4.x for userland and kmod (and
    # that the loaded module agrees), and the skip budget, the test-list
    # coverage and the csi-sanity spec floor are enforced on the merged logs.
    name: real ZFS 2.4 (Ubuntu 26.10 VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # the tarball actions/setup-go fetches for 1.27.3, pinned by checksum
      GO_TARBALL_URL: https://github.com/actions/go-versions/releases/download/1.27.3-39437817176/go-1.27.3-linux-x64.tar.gz
      GO_TARBALL_SHA256: d0fbe16a6a03fe5fbf5577ab36f95f0725af587820dca8a78e6edd4eb4e19fd6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
      # newest bake for these inputs; the exact key never matches (it ends
      # in the bake's run id), so cache-matched-key tells hit from miss
      - name: restore VM bundle
        id: vm
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zfsvm-bundle
          key: zfsvm-v1-ubuntu-24.04-stonking-${{ hashFiles('ci/vm/bake.sh', 'ci/vm/image/**') }}-none
          restore-keys: zfsvm-v1-ubuntu-24.04-stonking-${{ hashFiles('ci/vm/bake.sh', 'ci/vm/image/**') }}-
      - name: bake VM bundle (cache miss only, about 90s)
        if: steps.vm.outputs.cache-matched-key == ''
        run: |
          # the cloud image signing key ships in ubuntu-keyring on 24.04
          test -s /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
          ci/vm/bake.sh stonking current 2.4 "$RUNNER_TEMP/zfsvm-bundle"
      - name: save VM bundle
        if: steps.vm.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zfsvm-bundle
          key: zfsvm-v1-ubuntu-24.04-stonking-${{ hashFiles('ci/vm/bake.sh', 'ci/vm/image/**') }}-${{ github.run_id }}
      - name: boot VM, fetch Go (both in the background)
        run: |
          nohup ci/fetch-go.sh "$RUNNER_TEMP/go" >/dev/null 2>&1 &
          ci/real-zfs-vm.sh boot "$RUNNER_TEMP/zfsvm-bundle"
      # main saves under its commit; a PR restores main's newest, so only
      # the packages it changed recompile
      - name: restore Go build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-zfsvm-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-zfsvm-${{ hashFiles('go.sum') }}-
            go-zfsvm-
      - name: build test binaries (the guest starts on them)
        run: ci/real-zfs-vm.sh build
      - name: test (Ubuntu 26.10, real zfs 2.4)
        run: ci/real-zfs-vm.sh wait 2.4
      - name: save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-zfsvm-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: upload VM console and test logs
        if: failure() || cancelled() # a timeout cancels the job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-zfs-vm-logs
          path: |
            ${{ runner.temp }}/zfsvm/*.log
            ${{ runner.temp }}/zfsvm/share/out/
          if-no-files-found: ignore
          retention-days: 14
