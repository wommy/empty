name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test (simulator)
        run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: |
          go test -run '^$' -fuzz FuzzCreateConverges -fuzztime 20s ./internal/endpoint
          go test -run '^$' -fuzz FuzzParseColumns -fuzztime 10s ./internal/zfs
      - name: proto lint and generated code up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf lint
          buf generate
          git diff --exit-code -- gen/

  real-zfs:
    # the contract tests against Ubuntu 26.10 (OpenZFS 2.4.x, what TrueNAS 27
    # ships), booted under KVM: no hosted runner exists for it, and ZFS lives
    # in the kernel, so a container would test the host's ZFS instead
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: test (Ubuntu 26.10, real zfs)
        run: ci/real-zfs-vm.sh stonking current

  real-zfs-noble:
    # compatibility: the distro ZFS on the hosted runner (24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install zfs
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zfs version
      - name: create test pool
        run: |
          # sparse: thick zvols reserve space, the file uses none until written
          truncate -s 20G "$RUNNER_TEMP/vdev0"
          sudo zpool create -f -O compression=lz4 zfsep-test "$RUNNER_TEMP/vdev0"
      - name: test (real zfs)
        env:
          ZFS_TEST_POOL: zfsep-test
        run: sudo -E "$(command -v go)" test -count=1 -v ./internal/endpoint/... ./internal/server/...
      - name: csi-sanity (real zfs, filesystems and zvols)
        # Identity and Controller groups only; see internal/csi/sanity_test.go
        env:
          ZFS_TEST_POOL: zfsep-test
        run: |
          for at in mount block; do
            CSI_SANITY_ACCESS_TYPE=$at sudo -E "$(command -v go)" test -count=1 -v ./internal/csi/...
          done
      - name: destroy test pool
        if: always()
        run: sudo zpool destroy -f zfsep-test || true
