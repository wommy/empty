syntax = "proto3";

// ZFS endpoint: idempotent volume and snapshot lifecycle on one ZFS parent
// dataset, for thin CSI (or other) front ends.
//
// Contract, mirroring CSI so front ends translate field-for-field:
// - Create* are idempotent by name; a compatible repeat returns the existing
//   object, an incompatible one ALREADY_EXISTS.
// - Delete* of a missing object is OK.
// - A busy resource is ABORTED before the caller's deadline; retry.
// - Volumes with snapshots or dependent clones fail DeleteVolume with
//   FAILED_PRECONDITION and are left unchanged.
package zfsendpoint.v1;

option go_package = "github.com/wommy/empty/gen/zfsendpoint/v1;zfsendpointv1";

service EndpointService {
  // Feature detection: front ends of any version ask what this daemon does.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc ExpandVolume(ExpandVolumeRequest) returns (ExpandVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);

  // Garbage collection, off the request path: uncommitted volumes left by
  // abandoned creates, clone-source snapshots whose clone is gone, and owned
  // volumes outside the caller's desired set. Never touches unowned
  // datasets, desired volumes, CSI snapshots, or volumes with snapshots or
  // dependent clones (those are reported in skipped).
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);

  // NFS export of FILESYSTEM volumes, one client at a time (CSI
  // ControllerPublish/Unpublish). Offered only with CAPABILITY_FILE_EXPORT;
  // otherwise UNIMPLEMENTED.
  // - Publishing the same client in the same mode again is OK; in the other
  //   mode ALREADY_EXISTS.
  // - Unpublishing a client (or volume) that is not exported is OK.
  // - BLOCK volumes and filesystems not mounted on the storage host are
  //   FAILED_PRECONDITION.
  // - OK means the NFS server serves (or no longer serves) the client; if it
  //   does not, UNAVAILABLE, and a retry re-applies.
  rpc PublishFileExport(PublishFileExportRequest) returns (PublishFileExportResponse);
  rpc UnpublishFileExport(UnpublishFileExportRequest) returns (UnpublishFileExportResponse);
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_VOLUMES = 1;
  CAPABILITY_SNAPSHOTS = 2;
  CAPABILITY_CLONE_FROM_SNAPSHOT = 3;
  CAPABILITY_CLONE_FROM_VOLUME = 4;
  CAPABILITY_EXPAND = 5;
  CAPABILITY_LIST = 6;
  CAPABILITY_CAPACITY = 7;
  // CreateVolumeRequest.properties is honoured (default-deny allowlist).
  CAPABILITY_PROPERTIES = 8;
  CAPABILITY_FILE_EXPORT = 9; // PublishFileExport/UnpublishFileExport
  CAPABILITY_RECONCILE = 10;
  // reserved for upcoming edges: block export, metadata (CBT), modify
}

message GetCapabilitiesRequest {}
message GetCapabilitiesResponse {
  repeated Capability capabilities = 1;
  // the parent dataset this endpoint manages
  string parent = 2;
  string version = 3;
}

enum VolumeKind {
  VOLUME_KIND_UNSPECIFIED = 0; // treated as FILESYSTEM
  VOLUME_KIND_FILESYSTEM = 1;
  VOLUME_KIND_BLOCK = 2;
}

message Volume {
  string id = 1;
  string name = 2;
  string dataset = 3;
  VolumeKind kind = 4;
  uint64 capacity_bytes = 5;
  // "snapshot", "volume" or empty
  string source_type = 6;
  string source_id = 7;
  string device_path = 8; // BLOCK, on the storage host
  string mountpoint = 9;  // FILESYSTEM
}

message Snapshot {
  string id = 1; // "<volume id>@<name>"
  string name = 2;
  string source_volume_id = 3;
  uint64 size_bytes = 4;
  int64 creation_unix = 5;
  bool ready_to_use = 6;
}

message CreateVolumeRequest {
  string name = 1;
  VolumeKind kind = 2;
  uint64 capacity_bytes = 3;
  uint64 limit_bytes = 4;
  bool sparse = 5;  // BLOCK: no refreservation
  bool reserve = 6; // FILESYSTEM: refreservation = capacity
  oneof source {
    string source_snapshot_id = 7;
    string source_volume_id = 8;
  }
  // Native ZFS properties applied at create (StorageClass parameters).
  // Default-deny: only an allowlist is accepted, per kind, with validated
  // values; anything else, including user properties ("a:b"), is
  // INVALID_ARGUMENT.
  //   FILESYSTEM: compression, recordsize, atime, relatime, sync, logbias,
  //               dedup (off|on|verify), xattr, acltype, snapdir, copies
  //   BLOCK:      compression, volblocksize (create-only; a clone must match
  //               its source), sync, logbias, dedup, copies
  // A repeat with the same name is compatible only if every requested
  // property is set locally on the volume with the same value; otherwise
  // ALREADY_EXISTS.
  map<string, string> properties = 9;
}

message DeleteVolumeRequest { string volume_id = 1; }
message DeleteVolumeResponse {}

message ExpandVolumeRequest {
  string volume_id = 1;
  uint64 capacity_bytes = 2;
  uint64 limit_bytes = 3;
}

message GetVolumeRequest { string volume_id = 1; }

message ListVolumesRequest {
  int32 max_entries = 1;
  string starting_token = 2;
}
message ListVolumesResponse {
  repeated Volume volumes = 1;
  string next_token = 2;
}

message CreateSnapshotRequest {
  string name = 1;
  string source_volume_id = 2;
}
message DeleteSnapshotRequest { string snapshot_id = 1; }
message DeleteSnapshotResponse {}

message ListSnapshotsRequest {
  string snapshot_id = 1;
  string source_volume_id = 2;
  int32 max_entries = 3;
  string starting_token = 4;
}
message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
  string next_token = 2;
}

message GetCapacityRequest {}
message GetCapacityResponse { uint64 available_bytes = 1; }

message CreateVolumeResponse { Volume volume = 1; }

message ExpandVolumeResponse { Volume volume = 1; }

message GetVolumeResponse { Volume volume = 1; }

message CreateSnapshotResponse { Snapshot snapshot = 1; }

message ReconcileRequest {
  // The complete set of volume ids the caller wants kept. Every other owned,
  // committed volume is collected. Empty collects no committed volume: it
  // cannot be told apart from a caller that sent nothing.
  repeated string desired_volume_ids = 1;
  // Nothing created less than this long ago is touched (in-flight creates,
  // volumes newer than the caller's desired set). 0 means one hour.
  uint64 min_age_seconds = 2;
  // Return the plan without locking or applying it.
  bool dry_run = 3;
}

message ReconcileAction {
  string op = 1;     // "destroy" or "destroy-deferred"
  string target = 2; // "<volume id>" or "<volume id>@<snapshot>"
  string reason = 3;
}

message ReconcileSkip {
  string target = 1;
  string reason = 2;
}

message ReconcileResponse {
  // done (or, for a dry run, planned), in order
  repeated ReconcileAction actions = 1;
  repeated ReconcileSkip skipped = 2;
}

message PublishFileExportRequest {
  string volume_id = 1;
  // a hostname, IPv4 address or IPv4 CIDR ("10.0.0.0/24"); no wildcards,
  // netgroups or IPv6
  string client = 2;
  bool read_only = 3;
}
message PublishFileExportResponse {
  // path to mount from the storage host (server:export_path). It is read
  // fresh on every call: pass it on (CSI publish_context), do not store it.
  string export_path = 1;
}

message UnpublishFileExportRequest {
  string volume_id = 1;
  string client = 2;
}
message UnpublishFileExportResponse {}
