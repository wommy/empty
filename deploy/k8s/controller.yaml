# The CSI controller: zfs-csi plus the provisioner, resizer and snapshotter
# sidecars, on the ZFS host itself (hyperconverged, ADR 0006).
#
# Before applying:
#   - label the ZFS host:
#       kubectl label node <host> zfs-endpoint.wommy.github.io/host=true
#   - run the endpoint there for the parent dataset:
#       systemctl enable --now "zfs-endpoint@$(systemd-escape tank/k8s/vols).service"
#   - set -parent below to that dataset: zfs-csi dials
#     /run/zfs-endpoint/sock/<systemd-escape parent>/endpoint.sock, the
#     socket the unit serves (the one convention, internal/unixsock
#     EndpointAddr), and set endpoint-dir's hostPath and mountPath to that
#     socket's directory;
#   - build and push the zfs-csi image (none is published yet) with the
#     version stamped in:
#       go build -ldflags "-X github.com/wommy/empty/internal/version.Version=v0.1.0" ./cmd/zfs-csi
#
# Images are pinned by version tag. Pin each by digest (image@sha256:...)
# before production: a tag can be re-pushed.
#
# Sockets and users:
#   - /csi is an emptyDir shared by the four containers. kubelet makes it
#     0777; zfs-csi serves csi.sock there 0600 (unixsock.ListenShared), so
#     every container runs as uid 0, the socket's owner.
#   - /run/zfs-endpoint/sock/<escaped parent> is this endpoint's socket
#     directory on the host (0700 root, socket 0600 root): zfs-csi must run
#     as uid 0 to dial it. It needs no capability: owning uid 0 is enough
#     for the file modes. Mount only that directory, never
#     /run/zfs-endpoint: that one holds every endpoint's lock file and
#     socket directory (ADR 0001 v2, F1).
#   - No ControllerPublish, so no attacher sidecar (CSIDriver
#     attachRequired: false).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zfs-csi-controller
  namespace: zfs-csi
spec:
  # one endpoint per parent per host already serializes every call; a
  # second controller would add nothing but a leader election
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zfs-csi-controller
  template:
    metadata:
      labels:
        app: zfs-csi-controller
    spec:
      serviceAccountName: zfs-csi-controller
      priorityClassName: system-cluster-critical
      nodeSelector:
        zfs-endpoint.wommy.github.io/host: "true"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zfs-csi
          # TODO(digest): pin ghcr.io/wommy/zfs-csi:v0.1.0 by digest as well
          # once a release build publishes it; no image exists yet (README)
          image: ghcr.io/wommy/zfs-csi:v0.1.0
          args:
            - -parent=tank/k8s/vols
            - -csi-address=unix:///csi/csi.sock
            # block volumes stay off until a node plugin exists (ADR 0006)
            # - -enable-block
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: endpoint-dir
              mountPath: /run/zfs-endpoint/sock/tank-k8s-vols
        - name: csi-provisioner
          # Sidecars are pinned by tag and digest (the image index digest).
          # The digests are the ones kubernetes/k8s.io promotes for these tags
          # (registry.k8s.io/images/k8s-staging-sig-storage/images.yaml at
          # 28a29bedd1d1eded47d8592e86e34844d59c8830); not read back from
          # registry.k8s.io itself, which was unreachable when they were pinned.
          # Check with: crane digest registry.k8s.io/sig-storage/<image>:<tag>
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0@sha256:d5e46da8aff7d73d6f00c761dae94472bcda6e78f4f17b3802dc89d44de0111b
          args:
            - --csi-address=/csi/csi.sock
            # the endpoint waits up to -lock-wait (30s) for a busy resource
            - --timeout=60s
            - --extra-create-metadata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.1@sha256:2a0b297cc7c4cd376ac7413df339ff2fdaa1ec9d099aed92b5ea1f031ef7f639
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0@sha256:dd788d79cf4c1b8edee6d9b80b8a1ebfc51a38a365c5be656986b129be9ac784
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: endpoint-dir
          hostPath:
            # the endpoint's own socket directory, which zfs-endpoint
            # creates: start it first
            path: /run/zfs-endpoint/sock/tank-k8s-vols
            type: Directory
