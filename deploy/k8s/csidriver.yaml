# The CSI driver object for zfs-csi (driver name: internal/csi
# DefaultDriverName). Controller only: nothing attaches (no
# ControllerPublish), and the node side needs no pod info.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: zfs-endpoint.wommy.github.io
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes:
    - Persistent
