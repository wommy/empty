# Namespace, service account and the cluster permissions the three sidecars
# need: the union of the ClusterRoles in upstream deploy/kubernetes/rbac.yaml
# for the pinned tags (external-provisioner v5.2.0, external-resizer v1.13.1,
# external-snapshotter v8.2.0), minus what the flags in controller.yaml turn
# off, never more (deploy_test.go TestSidecarRBAC):
#   - pods: csi-resizer runs with --handle-volume-inuse-error=false (the
#     driver expands ONLINE, controller only), so it starts no pod informer.
#     Without the flag it needs pods get/list/watch, or it waits for that
#     informer's sync forever and never expands a volume.
#   - leases: no leader election (one replica, Recreate).
#   - csistoragecapacities, pods/replicasets get: no --enable-capacity.
#   - groupsnapshot.storage.k8s.io: the snapshotter's group snapshot feature
#     gate is off by default.
# zfs-csi itself calls no Kubernetes API, and gets no token (controller.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: zfs-csi
  labels:
    # the pod mounts a hostPath (the endpoint's socket directory), which
    # Pod Security baseline and restricted refuse; say so here rather than
    # inherit a cluster default that rejects the pod with only a FailedCreate
    # event on the ReplicaSet
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zfs-csi-controller
  namespace: zfs-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zfs-csi-controller
rules:
  # csi-provisioner (persistentvolumes patch: also csi-resizer)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  # csi-resizer
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  # csi-snapshotter (and csi-provisioner, for restores)
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zfs-csi-controller
subjects:
  - kind: ServiceAccount
    name: zfs-csi-controller
    namespace: zfs-csi
roleRef:
  kind: ClusterRole
  name: zfs-csi-controller
  apiGroup: rbac.authorization.k8s.io
