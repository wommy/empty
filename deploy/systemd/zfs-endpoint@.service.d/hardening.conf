# Extra sandboxing for zfs-endpoint@.service (H-16). Install as
# /etc/systemd/system/zfs-endpoint@.service.d/hardening.conf, then
# `systemctl daemon-reload` and restart the instances.
#
# Like the unit, nothing here may create a private mount namespace:
# zfs mounts datasets and exportfs edits host state from inside the
# service, and in a namespace (ProtectSystem, ProtectHome, PrivateTmp,
# PrivateDevices, ReadOnlyPaths, ProtectKernel*, ProtectControlGroups,
# ProtectProc, ProcSubset, PrivateMounts, ...) those mounts would never
# reach the host or nfsd. Neither may anything cut the network
# (PrivateNetwork, IPAddressDeny): exportfs resolves the host names in
# every export on each `exportfs -ra`. deploy/deploy_test.go refuses
# both kinds, active or not.

[Service]
# Active: none of these touches a mount, a device, a capability or a
# system call zfs, exportfs or the daemon makes.
# no new user, mount, net, ... namespaces (seccomp on unshare/clone/setns):
# zfs, exportfs and the Go runtime create none
RestrictNamespaces=yes
# the daemon holds no keys; ZFS encryption keys are not kernel keyrings
KeyringMode=private
# a core dump of the daemon would hold request data
LimitCORE=0
# a UTS namespace and a seccomp deny of sethostname/setdomainname. It
# creates no mount namespace: systemd's exec_needs_mount_namespace() does
# not consider it (v255 and v258 src/core/execute.c); it only makes
# /proc/sys/kernel/hostname read-only when a mount namespace exists for
# another reason, and here none does. The namespace starts as a copy of
# the host's names, and nothing the daemon runs sets them.
ProtectHostname=yes
# a deny list: ~@privileged and ~@mount would break zfs. None of these
# groups holds a call the Go runtime, zfs, exportfs or udevadm makes:
# @clock sets clocks (adjtimex, clock_settime), @module loads modules
# (the unit starts after zfs-import.target, so libzfs finds /dev/zfs and
# never runs modprobe), the rest are debugging, raw I/O, reboot, swap,
# CPU emulation and obsolete calls. Tighten later from SystemCallLog=.
SystemCallFilter=~@clock @cpu-emulation @debug @module @obsolete @raw-io @reboot @swap
SystemCallErrorNumber=EPERM

# Every active setting above is checked on the real-ZFS VM leg:
# ci/real-zfs-unit.sh starts the unit with this drop-in, makes a volume
# and deletes it, checks the journal for EPERM, and names any setting
# that stops the endpoint serving.
#
# NOT active: each needs more than that check covers (NFS export, zvols,
# clones, scan memory) before it ships.
#
# TODO(H-16, VM leg): the capability list is from reading, not tracing.
# CAP_SYS_ADMIN covers /dev/zfs ioctls and mount(2); DAC_OVERRIDE and
# DAC_READ_SEARCH cover mountpoints and export paths in other users'
# directories. Dropping CAP_SYS_MODULE stops libzfs loading the module
# itself (the unit orders After=zfs-import.target).
#CapabilityBoundingSet=CAP_SYS_ADMIN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_CHOWN CAP_SETUID CAP_SETGID
#AmbientCapabilities=
#
# TODO(H-16, VM leg): ProtectClock=yes implies DeviceAllow=char-rtc r,
# and one DeviceAllow line turns on the device allow-list, which would
# then refuse /dev/zfs unless it is listed too. Verify both together.
#ProtectClock=yes
#DevicePolicy=closed
#DeviceAllow=/dev/zfs rw
#
# TODO(H-16): size from scan memory (about 1 GB per 100k volumes, H-06);
# OOMScoreAdjust=-500 is inherited by every zfs child.
#MemoryHigh=1G
#MemoryMax=2G
